services:
  - type: pserv
    name: itahari-citizen-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: citizen-api-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_CHANGE_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
